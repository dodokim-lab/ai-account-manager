name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # acm runs only on macOS for now. Add an ubuntu job once Linux is supported
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Shell script syntax
        run: |
          sh -n install.sh
          sh -n bin/acm-statusline
          sh -n app/build.sh
      - name: Python syntax
        run: python3 -m py_compile bin/acm
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      # build.sh also installs into /Applications, so CI only checks that the app compiles
      - name: Compile the menu bar app
        run: |
          swiftc -parse-as-library -swift-version 5 \
            -target arm64-apple-macos14.0 \
            -o "$RUNNER_TEMP/ACM" app/Sources/*.swift
